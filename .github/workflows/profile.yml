name: Update profile assets

# Regenerates the snake, stats and cards with scripts/generate.py.
# No third-party actions: just git + the Python that ships with the runner.

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/icons/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_USER: ${{ github.repository_owner }}
    steps:
      - name: Clone repository
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Generate SVGs
        working-directory: repo
        run: python3 scripts/generate.py

      - name: Commit changes
        working-directory: repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile assets"
            git push
          fi
