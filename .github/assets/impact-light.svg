<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="422" viewBox="0 0 1200 422" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<style>@media (prefers-reduced-motion: reduce){.m{display:none}}</style>
<rect x="1" y="1" width="1198" height="420" rx="22" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="56" y="40" font-size="14" fill="#57606A">Before and after, measured on production systems (tick marks the starting point)</text>
<g font-size="13" fill="#57606A"><rect x="844" y="30" width="12" height="12" rx="3" fill="#B45309"/><text x="862" y="40">lower is better</text><rect x="984" y="30" width="12" height="12" rx="3" fill="#0F766E"/><text x="1002" y="40">higher is better</text></g>
<text x="56" y="82" font-size="17" font-weight="600" fill="#1F2328">API response time</text>
<text x="1144" y="82" text-anchor="end" font-size="17" font-weight="700" fill="#B45309">2s to under 800ms</text>
